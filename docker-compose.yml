version: '3.8'

networks:
  contador-net:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: contador-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contador
    expose:
      - "5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - contador-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d contador"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: contador-admin
    container_name: contador-admin
    restart: always
    ports:
      - "3031:3031"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/contador
      V2_DATABASE_URL: postgresql://user:password@db:5432/contador_v2
      ADMIN_PORT: 3031
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - contador-net

  v2:
    build:
      context: .
      dockerfile: Dockerfile.v2
    image: contador-v2
    container_name: contador-v2
    restart: always
    ports:
      - "3032:3032"
    env_file:
      - ./v2/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - contador-net
    # Рантайм-приложение живёт на ~80MB — лимит с большим запасом на пики
    # (много одновременных запросов, Prisma pool), но не бесконечный, чтобы
    # утечка/аномалия в контейнере не могла забрать всю RAM хоста, как это
    # сделала неограниченная сборка 19.08.2026 (см. Dockerfile.v2).
    mem_limit: 1g
    mem_reservation: 256m
