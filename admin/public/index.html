<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTADOR | Панель Администратора</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: rgba(79, 70, 229, 0.06);
            --bg-page: #f8fafc;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 2px 8px -1px rgba(0, 0, 0, 0.02);
            --card-shadow-hover: 0 16px 32px -4px rgba(79, 70, 229, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.02);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: #1e293b;
            overflow-x: hidden;
        }

        .premium-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .btn-premium {
            background-color: var(--primary);
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }

        .btn-premium:active {
            transform: translateY(0);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeInOverlay 0.2s ease-out;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react" data-plugins="transform-class-properties,proposal-optional-chaining,proposal-nullish-coalescing-operator">
        const { useState, useEffect, useCallback } = React;

        // ─── SVG Inline Icons lookup ──────────────────────────────────────────
        const SVGIcons = {
            Layout: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <rect width="7" height="9" x="3" y="3" rx="1.5" />
                    <rect width="7" height="5" x="14" y="3" rx="1" />
                    <rect width="7" height="9" x="14" y="12" rx="1.5" />
                    <rect width="7" height="5" x="3" y="16" rx="1" />
                </svg>
            ),
            Users: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.109A11.386 11.386 0 0 1 10.089 20M3 11.625a3 3 0 1 1 6 0 3 3 0 0 1-6 0Z" />
                    <path strokeLinecap="round" strokeLinejoin="round" d="M3.105 18.879A11.306 11.306 0 0 1 10.089 16c2.81 0 5.372.973 7.378 2.597M18 11.625a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            ),
            CreditCard: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <rect width="20" height="14" x="2" y="5" rx="3" />
                    <line x1="2" x2="22" y1="10" y2="10" />
                </svg>
            ),
            Zap: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                </svg>
            ),
            History: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            ),
            Settings: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827a1.125 1.125 0 0 1 .26 1.43l-1.297 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            ),
            LogOut: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                </svg>
            ),
            Plus: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            ),
            Trash2: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
            ),
            UserX: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M22 10.5h-6m-2.25-1.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM4 19.25A5.25 5.25 0 0 1 9.25 14h1.5A5.25 5.25 0 0 1 16 19.25V20H4v-.75Z" />
                </svg>
            ),
            Edit: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
            ),
            X: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            ),
            Search: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.637 10.637Z" />
                </svg>
            ),
            AlertTriangle: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                </svg>
            ),
            CheckCircle: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            ),
            Building: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.683 0-5.176.368-7.5 1.058V21M3 21h18M12 11.25v.008H12v-.008Zm0 3v.008H12v-.008Zm0 3v.008H12v-.008Zm-3.75-3v.008h-.008v-.008Zm0 3v.008h-.008v-.008Zm7.5-3v.008h-.008v-.008Zm0 3v.008h-.008v-.008Z" />
                </svg>
            ),
            User: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
            ),
            Mail: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
            ),
            Lock: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <rect width="18" height="12" x="3" y="11" rx="2" ry="2" />
                    <path strokeLinecap="round" strokeLinejoin="round" d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            ),
            ArrowRight: (props) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.2" stroke="currentColor" {...props}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            )
        };

        const LucideIcon = ({ name, size = 16, className = "" }) => {
            const Component = SVGIcons[name] || SVGIcons.Layout;
            return <Component className={className} style={{ width: size, height: size }} />;
        };

        // ─── Toast component ──────────────────────────────────────────────────
        const Toast = ({ msg, type, onClose }) => {
            useEffect(() => {
                const t = setTimeout(onClose, 3000);
                return () => clearTimeout(t);
            }, [onClose]);

            const bg = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
            const icon = type === 'error' ? 'AlertTriangle' : 'CheckCircle';

            return (
                <div className={`fixed bottom-6 right-6 z-[200] ${bg} text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm font-semibold fade-in`}>
                    <LucideIcon name={icon} size={18} className="text-white" />
                    <span>{msg}</span>
                </div>
            );
        };

        // ─── Custom Modal container ───────────────────────────────────────────
        const Modal = ({ title, children, onClose }) => (
            <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
                <div className="modal-box p-8">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-xl font-bold text-slate-900 tracking-tight">{title}</h3>
                        <button onClick={onClose} className="p-2 hover:bg-slate-50 text-slate-400 hover:text-slate-600 rounded-full transition-all">
                            <LucideIcon name="X" size={18} />
                        </button>
                    </div>
                    {children}
                </div>
            </div>
        );

        // ─── Confirm modal ───────────────────────────────────────────────────
        const ConfirmModal = ({ show, title, message, onConfirm, onCancel }) => {
            if (!show) return null;
            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onCancel()}>
                    <div className="modal-box p-8 border-red-50">
                        <div className="flex items-center space-x-3 mb-4 text-rose-600">
                            <LucideIcon name="AlertTriangle" size={24} />
                            <h3 className="text-xl font-bold tracking-tight">{title}</h3>
                        </div>
                        <p className="text-slate-500 text-sm leading-relaxed mb-8">{message}</p>
                        <div className="flex space-x-3">
                            <button
                                onClick={onConfirm}
                                className="flex-1 py-3 bg-rose-600 text-white rounded-xl font-bold hover:bg-rose-700 transition-all text-sm shadow-md shadow-rose-100"
                            >
                                Подтвердить
                            </button>
                            <button
                                onClick={onCancel}
                                className="flex-1 py-3 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition-all text-sm"
                            >
                                Отмена
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── Upgrade Days modal ────────────────────────────────────────────────
        const UpgradeDaysModal = ({ show, orgName, onConfirm, onCancel }) => {
            const [days, setDays] = useState('30');
            if (!show) return null;

            return (
                <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onCancel()}>
                    <div className="modal-box p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-bold text-slate-900 tracking-tight">Продлить PRO тариф</h3>
                            <button onClick={onCancel} className="p-2 hover:bg-slate-50 text-slate-400 hover:text-slate-600 rounded-full transition-all">
                                <LucideIcon name="X" size={18} />
                            </button>
                        </div>
                        <p className="text-slate-500 text-sm leading-relaxed mb-6">
                            Продление тарифа PRO для организации <strong className="text-slate-800">"{orgName}"</strong>. Укажите количество дней:
                        </p>
                        <div className="space-y-4 mb-8">
                            <input
                                type="number"
                                className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none"
                                value={days}
                                min="1"
                                onChange={e => setDays(e.target.value)}
                            />
                        </div>
                        <div className="flex space-x-3">
                            <button
                                onClick={() => onConfirm(days)}
                                className="flex-1 py-3 btn-premium rounded-xl font-bold text-sm shadow-md"
                            >
                                Продлить
                            </button>
                            <button
                                onClick={onCancel}
                                className="flex-1 py-3 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition-all text-sm"
                            >
                                Отмена
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── Stat Card component ──────────────────────────────────────────────
        const StatCard = ({ label, value, sub, accent }) => (
            <div className={`premium-card p-6 ${accent ? 'bg-indigo-50/20 border-indigo-100' : ''}`}>
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">{label}</p>
                <p className={`text-4xl font-extrabold tracking-tight ${accent ? 'text-indigo-600' : 'text-slate-900'}`}>{value}</p>
                {sub && <p className="text-[10px] font-bold text-slate-400 mt-2.5 uppercase tracking-wide">{sub}</p>}
            </div>
        );

        // ─── Main App Component ───────────────────────────────────────────────
        const App = () => {
            const [tab, setTab] = useState('v2_dashboard');
            const [password, setPassword] = useState(localStorage.getItem('admin_pass') || '');
            const [config, setConfig] = useState(null);
            const [isAuthed, setIsAuthed] = useState(false);
            const [loading, setLoading] = useState(false);
            const [loginLoading, setLoginLoading] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [notification, setNotification] = useState(null);

            // Modals states
            const [confirmState, setConfirmState] = useState({ show: false, title: '', message: '', onConfirm: null });

            // V2 state
            const [v2Stats, setV2Stats] = useState({ users: 0, organizations: 0, pro_count: 0, free_count: 0, tx_by_status: {} });
            const [v2Users, setV2Users] = useState([]);
            const [v2Search, setV2Search] = useState('');
            const [v2UpgradeState, setV2UpgradeState] = useState({ show: false, orgId: '', orgName: '' });
            const [v2ShowAddUser, setV2ShowAddUser] = useState(false);
            const [v2EditUser, setV2EditUser] = useState(null);
            const [v2NewUser, setV2NewUser] = useState({ email: '', password: '', name: '', orgName: '' });
            // V2 extended state
            const [v2ExtraStats, setV2ExtraStats] = useState({ backlog: 0, riskItems: 0, freeOrgs: 0, regsSeries: [] });
            const [v2ExpiringPro, setV2ExpiringPro] = useState([]);
            const [v2OrgsList, setV2OrgsList] = useState([]);
            const [v2OrgsTotal, setV2OrgsTotal] = useState(0);
            const [v2OrgsPage, setV2OrgsPage] = useState(1);
            const [v2OrgSearch, setV2OrgSearch] = useState('');
            const [v2OrgPlanFilter, setV2OrgPlanFilter] = useState('');
            const [v2OrgRegimeFilter, setV2OrgRegimeFilter] = useState('');
            const [v2OrgDetail, setV2OrgDetail] = useState(null);
            const [v2OrgDetailTab, setV2OrgDetailTab] = useState('info');

                                                                <td className="px-5 py-3">
                                                                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${rule.createdFrom === 'USER_ANSWER' ? 'bg-emerald-50 text-emerald-600' : 'bg-indigo-50 text-indigo-600'}`}>{rule.createdFrom}</span>
                                                                </td>
                                                                <td className="px-5 py-3 text-right">
                                                                    <button onClick={() => triggerConfirm('Удалить правило', `Удалить правило "${rule.matchType}: ${rule.matchValue}"?`, async () => {
                                                                        await apiFetch(`/api/v2/rules/${rule.id}`, 'DELETE');
                                                                        setV2Rules(prev => prev.filter(r => r.id !== rule.id));
                                                                        notify('Правило удалено');
                                                                    })}
                                                                        className="text-[9px] font-bold px-2 py-1 bg-white border border-rose-100 text-rose-500 rounded-lg hover:bg-rose-50 transition-all uppercase">
                                                                        Удалить
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                    {v2Rules.length === 0 && v2RulesOrgId && (
                                        <div className="p-16 text-center text-slate-400 font-bold uppercase tracking-widest text-xs bg-white rounded-2xl border border-dashed">
                                            Правил не найдено для данной организации
                                        </div>
                                    )}
                                    {!v2RulesOrgId && (
                                        <div className="p-16 text-center text-slate-400 font-bold uppercase tracking-widest text-xs bg-white rounded-2xl border border-dashed">
                                            Введите ID организации или выберите из списка выше
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Custom Confirmation Modal */}
                            <ConfirmModal
                                show={confirmState.show}
                                title={confirmState.title}
                                message={confirmState.message}
                                onConfirm={confirmState.onConfirm}
                                onCancel={() => setConfirmState({ show: false, title: '', message: '', onConfirm: null })}
                            />


                            {/* V2 Upgrade Days Modal — глобальный, работает из любой вкладки */}
                            <UpgradeDaysModal
                                show={v2UpgradeState.show}
                                orgName={v2UpgradeState.orgName}
                                onConfirm={async (days) => {
                                    if (days) {
                                        await apiFetch(`/api/v2/orgs/${v2UpgradeState.orgId}/upgrade`, 'POST', { days });
                                        if (tab === 'v2_users') loadV2Users();
                                        if (tab === 'v2_orgs') loadV2Orgs(v2OrgsPage, v2OrgSearch, v2OrgPlanFilter, v2OrgRegimeFilter);
                                        if (tab === 'v2_dashboard') { loadV2Dashboard(); loadV2ExpiringPro(); }
                                        notify(`V2 PRO продлён на ${days} дн.`);
                                    }
                                    setV2UpgradeState({ show: false, orgId: '', orgName: '' });
                                }}
                                onCancel={() => setV2UpgradeState({ show: false, orgId: '', orgName: '' })}
                            />

                            {/* V2 Edit User Name Modal */}
                            {v2EditUserName && (
                                <Modal title="Изменить имя пользователя" onClose={() => setV2EditUserName(null)}>
                                    <div className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Имя</label>
                                            <input type="text" placeholder="Иван Иванов" className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                value={v2EditUserName.name} onChange={e => setV2EditUserName({ ...v2EditUserName, name: e.target.value })} />
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            const r = await apiFetch(`/api/v2/users/${v2EditUserName.id}`, 'PATCH', { name: v2EditUserName.name });
                                            if (r?.success) { setV2EditUserName(null); loadV2Users(); notify('Имя обновлено ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">Сохранить</button>
                                        <button onClick={() => setV2EditUserName(null)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Add User to Org Modal */}
                            {v2AddToOrgState && (
                                <Modal title={`Добавить ${v2AddToOrgState.userEmail} в организацию`} onClose={() => setV2AddToOrgState(null)}>
                                    <div className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Поиск организации</label>
                                            <input type="text" placeholder="Название организации..." className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                value={v2AddToOrgSearch} onChange={e => setV2AddToOrgSearch(e.target.value)} />
                                        </div>
                                        {v2AddToOrgSearch.length >= 2 && (
                                            <div className="space-y-1 max-h-40 overflow-y-auto">
                                                {v2OrgsList.filter(o => o.name.toLowerCase().includes(v2AddToOrgSearch.toLowerCase()) || (o.inn || '').includes(v2AddToOrgSearch)).slice(0, 5).map(o => (
                                                    <button key={o.id} onClick={async () => {
                                                        const r = await apiFetch(`/api/v2/orgs/${o.id}/members`, 'POST', { userId: v2AddToOrgState.userId, role: v2AddToOrgRole });
                                                        if (r?.success) { setV2AddToOrgState(null); loadV2Users(); notify(`Добавлен в "${o.name}" ✓`); }
                                                        else notify(r?.error || 'Ошибка', 'error');
                                                    }} className="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-emerald-50 hover:border-emerald-200 border border-slate-100 rounded-xl transition-all text-sm font-semibold text-slate-700">
                                                        {o.name} {o.inn ? `· ИНН ${o.inn}` : ''}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Роль</label>
                                            <select value={v2AddToOrgRole} onChange={e => setV2AddToOrgRole(e.target.value)}
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-bold">
                                                <option value="OWNER">OWNER</option>
                                                <option value="ADMIN">ADMIN</option>
                                                <option value="ACCOUNTANT">ACCOUNTANT</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={() => setV2AddToOrgState(null)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Закрыть</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Create Org Modal */}
                            {v2ShowCreateOrg && (
                                <Modal title="Создать организацию V2" onClose={() => setV2ShowCreateOrg(false)}>
                                    <div className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Название *</label>
                                            <input type="text" placeholder="ООО 'Компания'" className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                value={v2NewOrg.name} onChange={e => setV2NewOrg({ ...v2NewOrg, name: e.target.value })} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">ИНН (опционально)</label>
                                            <input type="text" placeholder="123456789" className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                value={v2NewOrg.inn} onChange={e => setV2NewOrg({ ...v2NewOrg, inn: e.target.value })} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Налоговый режим</label>
                                            <select value={v2NewOrg.taxRegime} onChange={e => setV2NewOrg({ ...v2NewOrg, taxRegime: e.target.value })}
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-semibold">
                                                <option value="TURNOVER_TAX">УСН (оборотный налог)</option>
                                                <option value="VAT">НДС</option>
                                            </select>
                                        </div>
                                        <div className="flex items-center space-x-3">
                                            <input type="checkbox" id="new-org-vat" checked={v2NewOrg.isVatPayer}
                                                onChange={e => setV2NewOrg({ ...v2NewOrg, isVatPayer: e.target.checked })} className="w-4 h-4 accent-emerald-600" />
                                            <label htmlFor="new-org-vat" className="text-sm font-semibold text-slate-700">Плательщик НДС</label>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            if (!v2NewOrg.name.trim()) return notify('Укажите название', 'error');
                                            setLoading(true);
                                            const r = await apiFetch('/api/v2/orgs', 'POST', v2NewOrg);
                                            setLoading(false);
                                            if (r?.success) { setV2ShowCreateOrg(false); loadV2Orgs(1, v2OrgSearch, v2OrgPlanFilter, v2OrgRegimeFilter); notify('Организация создана ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} disabled={loading} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm disabled:opacity-50">Создать</button>
                                        <button onClick={() => setV2ShowCreateOrg(false)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Add Member Modal */}
                            {v2AddMemberState && (
                                <Modal title="Добавить участника в организацию" onClose={() => setV2AddMemberState(null)}>
                                    <div className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Email пользователя</label>
                                            <input type="email" placeholder="user@example.com" className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                value={v2AddMemberEmail} onChange={e => setV2AddMemberEmail(e.target.value)} />
                                            <p className="text-[10px] text-slate-400 pl-1">Или выберите из клиентов V2:</p>
                                            <div className="max-h-32 overflow-y-auto space-y-1">
                                                {v2Users.filter(u => !v2AddMemberEmail || u.email.toLowerCase().includes(v2AddMemberEmail.toLowerCase())).slice(0, 5).map(u => (
                                                    <button key={u.id} onClick={() => setV2AddMemberEmail(u.email)}
                                                        className={`w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition-all border ${v2AddMemberEmail === u.email ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-100 text-slate-700 hover:bg-emerald-50'}`}>
                                                        {u.email} {u.name ? `· ${u.name}` : ''}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Роль</label>
                                            <select value={v2AddMemberRole} onChange={e => setV2AddMemberRole(e.target.value)}
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-bold">
                                                <option value="OWNER">OWNER</option>
                                                <option value="ADMIN">ADMIN</option>
                                                <option value="ACCOUNTANT">ACCOUNTANT</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            const user = v2Users.find(u => u.email.toLowerCase() === v2AddMemberEmail.toLowerCase());
                                            if (!user) return notify('Пользователь не найден', 'error');
                                            const r = await apiFetch(`/api/v2/orgs/${v2AddMemberState.orgId}/members`, 'POST', { userId: user.id, role: v2AddMemberRole });
                                            if (r?.success) { setV2AddMemberState(null); await loadV2OrgDetail(v2AddMemberState.orgId); notify('Участник добавлен ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">Добавить</button>
                                        <button onClick={() => setV2AddMemberState(null)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Change Member Role Modal */}
                            {v2EditMemberRole && (
                                <Modal title="Изменить роль участника" onClose={() => setV2EditMemberRole(null)}>
                                    <div className="space-y-4">
                                        <p className="text-sm text-slate-600">{v2EditMemberRole.email}</p>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Новая роль</label>
                                            <select defaultValue={v2EditMemberRole.currentRole} id="edit-member-role-select"
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-bold">
                                                <option value="OWNER">OWNER</option>
                                                <option value="ADMIN">ADMIN</option>
                                                <option value="ACCOUNTANT">ACCOUNTANT</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            const role = document.getElementById('edit-member-role-select').value;
                                            const r = await apiFetch(`/api/v2/orgs/${v2EditMemberRole.orgId}/members/${v2EditMemberRole.userId}/role`, 'PATCH', { role });
                                            if (r?.success) { setV2EditMemberRole(null); await loadV2OrgDetail(v2EditMemberRole.orgId); notify('Роль изменена ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">Сохранить</button>
                                        <button onClick={() => setV2EditMemberRole(null)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Add Bank Account Modal */}
                            {v2ShowAddBankAccount && v2OrgDetail && (
                                <Modal title="Добавить банковский счёт" onClose={() => setV2ShowAddBankAccount(false)}>
                                    <div className="space-y-4">
                                        {[
                                            { field: 'name', label: 'Название счёта *', placeholder: 'Расчётный счёт UZS' },
                                            { field: 'bankName', label: 'Название банка', placeholder: 'Uzpromstroybank' },
                                            { field: 'accountNumber', label: 'Номер счёта', placeholder: '20208000...' }
                                        ].map(f => (
                                            <div key={f.field} className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">{f.label}</label>
                                                <input type="text" placeholder={f.placeholder} className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                    value={v2NewBankAccount[f.field]} onChange={e => setV2NewBankAccount({ ...v2NewBankAccount, [f.field]: e.target.value })} />
                                            </div>
                                        ))}
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Валюта</label>
                                            <select value={v2NewBankAccount.currency} onChange={e => setV2NewBankAccount({ ...v2NewBankAccount, currency: e.target.value })}
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-bold">
                                                <option value="UZS">UZS</option>
                                                <option value="USD">USD</option>
                                                <option value="EUR">EUR</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            if (!v2NewBankAccount.name.trim()) return notify('Укажите название', 'error');
                                            const r = await apiFetch(`/api/v2/orgs/${v2OrgDetail.org.id}/bank-accounts`, 'POST', v2NewBankAccount);
                                            if (r?.success) { setV2ShowAddBankAccount(false); await loadV2OrgDetail(v2OrgDetail.org.id); notify('Счёт добавлен ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">Добавить</button>
                                        <button onClick={() => setV2ShowAddBankAccount(false)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Edit Bank Account Modal */}
                            {v2EditBankAccountData && (
                                <Modal title="Редактировать банковский счёт" onClose={() => setV2EditBankAccountData(null)}>
                                    <div className="space-y-4">
                                        {[
                                            { field: 'name', label: 'Название счёта *', placeholder: 'Расчётный счёт' },
                                            { field: 'bankName', label: 'Название банка', placeholder: 'Uzpromstroybank' },
                                            { field: 'accountNumber', label: 'Номер счёта', placeholder: '20208000...' }
                                        ].map(f => (
                                            <div key={f.field} className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">{f.label}</label>
                                                <input type="text" placeholder={f.placeholder} className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none"
                                                    value={v2EditBankAccountData[f.field]} onChange={e => setV2EditBankAccountData({ ...v2EditBankAccountData, [f.field]: e.target.value })} />
                                            </div>
                                        ))}
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Валюта</label>
                                            <select value={v2EditBankAccountData.currency} onChange={e => setV2EditBankAccountData({ ...v2EditBankAccountData, currency: e.target.value })}
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-bold">
                                                <option value="UZS">UZS</option>
                                                <option value="USD">USD</option>
                                                <option value="EUR">EUR</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            if (!v2EditBankAccountData.name.trim()) return notify('Укажите название', 'error');
                                            const r = await apiFetch(`/api/v2/bank-accounts/${v2EditBankAccountData.id}`, 'PATCH', v2EditBankAccountData);
                                            if (r?.success) { setV2EditBankAccountData(null); await loadV2OrgDetail(v2OrgDetail.org.id); notify('Счёт обновлён ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">Сохранить</button>
                                        <button onClick={() => setV2EditBankAccountData(null)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}

                            {/* V2 Create Period Modal */}
                            {v2ShowCreatePeriod && v2OrgDetail && (
                                <Modal title="Создать период учёта" onClose={() => setV2ShowCreatePeriod(false)}>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Год *</label>
                                                <input type="number" min="2020" max="2035" className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none font-bold"
                                                    value={v2NewPeriod.year} onChange={e => setV2NewPeriod({ ...v2NewPeriod, year: e.target.value })} />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Месяц * (1-12)</label>
                                                <input type="number" min="1" max="12" className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 outline-none font-bold"
                                                    value={v2NewPeriod.month} onChange={e => setV2NewPeriod({ ...v2NewPeriod, month: e.target.value })} />
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1">Режим</label>
                                            <select value={v2NewPeriod.mode} onChange={e => setV2NewPeriod({ ...v2NewPeriod, mode: e.target.value })}
                                                className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none font-bold">
                                                <option value="ACTIVE">ACTIVE — текущий</option>
                                                <option value="HISTORICAL">HISTORICAL — ретро-ввод</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={async () => {
                                            const r = await apiFetch(`/api/v2/orgs/${v2OrgDetail.org.id}/periods`, 'POST', v2NewPeriod);
                                            if (r?.success) { setV2ShowCreatePeriod(false); await loadV2OrgDetail(v2OrgDetail.org.id); notify('Период создан ✓'); }
                                            else notify(r?.error || 'Ошибка', 'error');
                                        }} className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">Создать</button>
                                        <button onClick={() => setV2ShowCreatePeriod(false)} className="flex-1 py-3.5 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 text-sm">Отмена</button>
                                    </div>
                                </Modal>
                            )}


                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
